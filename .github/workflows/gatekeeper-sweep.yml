# ai-sdlc: derekwinters/ai-sdlc@v0.5.0 hash=57248142eff57fd3
# Managed by `adopt`. Local edits are preserved but stop this file
# being updated — `adopt verify` will report it.
name: gatekeeper-sweep

# A caller. The logic is in ai-sdlc; this exists because a trigger
# cannot be centralised — it must be declared in the repository it
# fires for.
#
# Pinned to a commit rather than a tag: a tag can move, and this runs
# with this repository's token. Upgrade with `adopt apply <version>`,
# which rewrites both the SHA and the comment.
#
# Nothing is checked out here. The action is fetched by the runner,
# outside this repository's workspace.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  # One sweep at a time, and never cancelled: it reads the whole board,
  # and a cancelled run leaves the labels it was moving half applied.
  group: gatekeeper-sweep
  cancel-in-progress: false

jobs:
  gatekeeper-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: derekwinters/ai-sdlc/.github/actions/gatekeeper@9a51041eb76254a2cd7e306ed7ac352a2cf085d6 # v0.5.0
        with:
          mode: sweep
          stale-after: "1800"
