# Grouped weekly dependency updates with a 14-day cooldown, so updates arrive as a
# few consolidated PRs instead of a stream of singletons.
#
# For npm, the group only covers minor and patch updates. Major updates arrive as
# their own individual PRs, so one breaking major upgrade can't block every
# harmless update that would otherwise share its grouped PR.
#
# Every entry labels its PRs `no-closing-keyword` (REL-009): Dependabot PRs close no
# issue, and the label is what lets them pass the closing-keyword check. Setting
# `labels:` replaces Dependabot's default labels, so each list also keeps
# `dependencies` and the ecosystem label Dependabot would otherwise apply.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    labels:
      - dependencies
      - javascript
      - no-closing-keyword
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint only supports TypeScript <6.1, so TS 7 can't install yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Keep the Node type definitions matching the Node 22 runtime used in CI and the Dockerfile.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /
    labels:
      - dependencies
      - docker
      - no-closing-keyword
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      docker-images:
        patterns:
          - '*'
    ignore:
      # Node 22 is what CI and the Dockerfile run, and Dependabot can't tell LTS from
      # non-LTS majors, so all Node majors are ignored; a Node upgrade is a deliberate manual change.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /
    labels:
      - dependencies
      - docker_compose
      - no-closing-keyword
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      compose-images:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    labels:
      - dependencies
      - github_actions
      - no-closing-keyword
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - '*'
